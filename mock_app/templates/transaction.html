<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Process Transaction</title>
    <style>
        body { font-family: monospace; background-color: #f0f0f0; padding: 20px; }
        .container { border: 2px solid #333; padding: 15px; background-color: white; width: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard/{{ member_id }}">← Back to Dashboard</a>
        <h2>New Transaction</h2>
        
        <form action="/transaction/{{ member_id }}" method="POST">
            <div>
                <label>Account Type:</label>
                <select name="account_type">
                    <option value="savings">Savings</option>
                    <option value="checking">Checking</option>
                </select>
            </div>
            <br>
            <div>
                <label>Amount:</label>
                <input type="number" step="0.01" name="amount" required>
            </div>
            <br>
            
            {% if member_id == '777' %}
            <div style="border: 1px solid orange; padding: 10px; margin-bottom: 10px; background: #fff8e1;">
                <strong>⚠️ SECURITY FLAG</strong><br>
                <input type="checkbox" id="override-box" onchange="document.getElementById('submit-btn').disabled = !this.checked;"> 
                <label for="override-box">Supervisor Override Required</label>
            </div>
            <button type="submit" id="submit-btn" disabled>Submit Transaction</button>
            {% else %}
            <button type="submit" id="submit-btn">Submit Transaction</button>
            {% endif %}
            
        </form>
    </div>
</body>
</html>
